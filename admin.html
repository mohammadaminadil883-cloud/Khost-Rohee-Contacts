<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c7a">
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="admin-icon-192.png">
<title>د مدیر پاڼه - د زده کوونکو شمېرې</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14232e;--mute:#5d6f7c;--line:#d5dde3;--brand:#0f5c7a;--bi:#fff;--call:#168a4a;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e171d;--card:#17232b;--ink:#e8eff3;--mute:#9fb0bb;--line:#2b3b45;--brand:#4cb3d6;--bi:#06222d;--call:#3fc27a;--danger:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:6px 0}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,button:focus-visible,textarea:focus{outline:3px solid var(--brand);outline-offset:1px}
input[type=tel],input[type=email],input[type=password]{direction:ltr;text-align:right}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.primary{background:var(--brand);color:var(--bi)}
.ghost{background:transparent;color:var(--mute);border:1.5px solid var(--line)}
.del{color:var(--danger);border-color:var(--danger)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.search{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.search input{border-color:var(--brand);font-size:1.1rem;padding:13px 14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
label{display:block;font-size:.88rem;color:var(--mute)}
details summary{cursor:pointer;font-weight:700;color:var(--brand)}
.name{font-weight:700;font-size:1.1rem}
.meta{color:var(--mute);font-size:.92rem}
.calls,.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dial{display:inline-flex;gap:8px;background:var(--call);color:#fff;text-decoration:none;border-radius:10px;padding:9px 16px;font-weight:700}
.dial span{direction:ltr}
.acts button{padding:5px 12px;font-size:.88rem}
.msg{padding:8px 12px;border-radius:10px;margin:8px 0;background:var(--card);border:1.5px solid var(--line)}
.err{color:var(--danger);border-color:var(--danger)}
.hide{display:none}
.id{direction:ltr;display:inline-block;background:var(--line);border-radius:6px;padding:0 8px;font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">

<div id="loginView" class="hide">
  <h1>د مدیر ننوتل</h1>
  <div class="card">
    <form id="lf">
      <div class="full"><label>بریښنالیک</label><input id="em" type="email" required autocomplete="username"></div>
      <div class="full"><label>پټنوم</label><input id="pw" type="password" required autocomplete="current-password"></div>
      <div class="full"><button class="primary" type="submit">ننوځه</button></div>
    </form>
  </div>
  <div id="lmsg"></div>
</div>

<div id="appView" class="hide">
  <div class="top"><h1>د زده کوونکو شمېرې</h1><button class="ghost" id="out">وتل</button></div>
  <div class="search"><input id="q" type="search" placeholder="د ID، نوم، پلار، ټولګي یا شمېرې په اساس ولټوه…" autocomplete="off"></div>
  <div id="msg"></div>

  <div class="card"><details id="addBox"><summary id="addTitle">+ نوی زده کوونکی ثبت کړه</summary>
    <form id="f" style="margin-top:10px">
      <div><label>د زده کوونکي ID *</label><input id="sid" required></div>
      <div><label>نوم *</label><input id="name" required></div>
      <div><label>د پلار نوم</label><input id="father"></div>
      <div><label>ټولګی</label><input id="cls"></div>
      <div><label>لومړۍ شمېره *</label><input id="p1" type="tel" inputmode="tel" required></div>
      <div><label>دوهمه شمېره</label><input id="p2" type="tel" inputmode="tel"></div>
      <div class="full" style="display:flex;gap:8px"><button class="primary" id="saveBtn" type="submit">ثبت کړه</button><button class="ghost" type="button" id="cancel">لغوه</button></div>
    </form></details></div>

  <div class="card"><details><summary>د CSV څخه ډېر زده کوونکي داخلول</summary>
    <p class="meta">هر کرښه یو زده کوونکی، په دې ترتیب (د کامې سره جلا): <b dir="ltr">ID, نوم, د پلار نوم, ټولګی, شمېره۱, شمېره۲</b></p>
    <textarea id="csv" rows="6" dir="ltr" placeholder="1001,Ahmad,Karim,7-A,0700123456,0799123456"></textarea>
    <div style="margin-top:8px"><button class="primary" id="imp">داخل کړه</button></div>
  </details></div>

  <div class="meta" id="count"></div>
  <div id="list"></div>
</div>

</div>
<script>
(function(){
  var URL_="https://wxnssbkdgnrvydvzwqzs.supabase.co";
  var KEY="sb_publishable_EzNuc2IHffzprMUsoEN4Pg_Fe-9GBf_";
  var $=function(i){return document.getElementById(i)};
  if(!window.supabase){document.body.innerHTML='<div class="wrap"><div class="msg err">د انټرنټ اړیکه ونه شوه. وروسته بیا هڅه وکړه.</div></div>';return}
  var sb=window.supabase.createClient(URL_,KEY), data=[], editId=null;
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function norm(s){return String(s||"").replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)}).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).toLowerCase()}
  function tel(s){return norm(s).replace(/[^\d+]/g,"")}
  function say(t,bad){$("msg").innerHTML=t?'<div class="msg'+(bad?' err':'')+'">'+esc(t)+'</div>':""}
  function show(logged){$("loginView").classList.toggle("hide",logged);$("appView").classList.toggle("hide",!logged)}

  async function loadAll(){
    say("ډیټا راځي…");var all=[],from=0,step=1000;
    while(true){
      var r=await sb.from("students").select("*").eq("deleted",false).order("name").range(from,from+step-1);
      if(r.error){say("تېروتنه: "+r.error.message,true);return}
      all=all.concat(r.data);if(r.data.length<step)break;from+=step;
    }
    data=all;say("");render();
  }
  function render(){
    var q=norm($("q").value.trim()),qd=q.replace(/\s/g,"");
    var rows=data.filter(function(s){
      if(!q)return true;
      return norm([s.student_id,s.name,s.father_name,s.class_name].join(" ")).indexOf(q)>-1||(qd&&(tel(s.phone1).indexOf(qd)>-1||tel(s.phone2).indexOf(qd)>-1));
    });
    $("count").textContent="ټول: "+data.length+" — ښودل شوي: "+rows.length;
    if(!rows.length){$("list").innerHTML='<div class="msg">هېڅ پایله ونه موندل شوه.</div>';return}
    $("list").innerHTML=rows.slice(0,200).map(function(s){
      var m=[s.father_name?"د "+esc(s.father_name)+" زوی/لور":"",s.class_name?"ټولګی: "+esc(s.class_name):""].filter(Boolean).join(" • ");
      return '<div class="card"><div class="name">'+esc(s.name)+' <span class="id">'+esc(s.student_id)+'</span></div>'+(m?'<div class="meta">'+m+'</div>':'')+
      '<div class="calls"><a class="dial" href="tel:'+esc(tel(s.phone1))+'">📞 زنګ ووهه <span>'+esc(s.phone1)+'</span></a>'+
      (s.phone2?'<a class="dial" href="tel:'+esc(tel(s.phone2))+'">📞 <span>'+esc(s.phone2)+'</span></a>':'')+'</div>'+
      '<div class="acts"><button class="ghost" data-e="'+esc(s.id)+'">سمون</button><button class="ghost del" data-d="'+esc(s.id)+'">ړنګول</button></div></div>';
    }).join("")+(rows.length>200?'<div class="msg">لومړي ۲۰۰ پایلې ښودل شوې. لټون ډېر دقیق کړه.</div>':"");
  }
  function reset(){editId=null;$("f").reset();$("addTitle").textContent="+ نوی زده کوونکی ثبت کړه";$("saveBtn").textContent="ثبت کړه";$("addBox").open=false}
  function errText(e){return e.code==="23505"?"دا ID مخکې ثبت شوی دی.":e.message}

  $("lf").addEventListener("submit",async function(e){
    e.preventDefault();$("lmsg").innerHTML="";
    var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(r.error){$("lmsg").innerHTML='<div class="msg err">بریښنالیک یا پټنوم ناسم دی.</div>';return}
    show(true);loadAll();
  });
  $("out").addEventListener("click",async function(){await sb.auth.signOut();data=[];show(false)});
  $("q").addEventListener("input",render);
  $("cancel").addEventListener("click",reset);

  $("f").addEventListener("submit",async function(e){
    e.preventDefault();
    var o={student_id:$("sid").value.trim(),name:$("name").value.trim(),father_name:$("father").value.trim()||null,class_name:$("cls").value.trim()||null,phone1:$("p1").value.trim(),phone2:$("p2").value.trim()||null};
    var r=editId?await sb.from("students").update(o).eq("id",editId):await sb.from("students").insert(o);
    if(r.error){say("تېروتنه: "+errText(r.error),true);return}
    reset();say("خوندي شو ✓");loadAll();
  });

  $("list").addEventListener("click",async function(e){
    var d=e.target.getAttribute("data-d"),ed=e.target.getAttribute("data-e");
    if(d){var s=data.filter(function(x){return x.id===d})[0];
      if(s&&confirm("«"+s.name+"» ړنګ شي؟")){var r=await sb.from("students").update({deleted:true}).eq("id",d);
        if(r.error)say("تېروتنه: "+r.error.message,true);else loadAll()}}
    if(ed){var t=data.filter(function(x){return x.id===ed})[0];if(!t)return;editId=ed;
      $("sid").value=t.student_id;$("name").value=t.name;$("father").value=t.father_name||"";$("cls").value=t.class_name||"";$("p1").value=t.phone1;$("p2").value=t.phone2||"";
      $("addTitle").textContent="د زده کوونکي معلومات سمول";$("saveBtn").textContent="بدلونونه خوندي کړه";$("addBox").open=true;window.scrollTo({top:0,behavior:"smooth"})}
  });

  $("imp").addEventListener("click",async function(){
    var lines=$("csv").value.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
    if(lines.length&&/id/i.test(lines[0])&&!/\d{6}/.test(lines[0]))lines.shift();
    var rows=[],bad=0;
    lines.forEach(function(l){var c=l.split(",").map(function(x){return x.trim()});
      if(c[0]&&c[1]&&c[4])rows.push({student_id:c[0],name:c[1],father_name:c[2]||null,class_name:c[3]||null,phone1:c[4],phone2:c[5]||null});else bad++});
    if(!rows.length){say("هېڅ سمه کرښه ونه موندل شوه (ID، نوم او لومړۍ شمېره اړینې دي).",true);return}
    var ids={};for(var i=0;i<rows.length;i++){if(ids[rows[i].student_id]){say("په CSV کې ID تکرار دی: "+rows[i].student_id,true);return}ids[rows[i].student_id]=1}
    for(var k=0;k<rows.length;k+=200){var r=await sb.from("students").insert(rows.slice(k,k+200));
      if(r.error){say("تېروتنه: "+errText(r.error)+" (مخکې ځینې کرښې ممکن داخلې شوې وي، لیست وګوره)",true);loadAll();return}}
    $("csv").value="";say(rows.length+" زده کوونکي داخل شول"+(bad?" ("+bad+" ناسمې کرښې پریښودل شوې)":"")+" ✓");loadAll();
  });

  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session){show(true);loadAll()}else show(false)});
})();
</script>
</body>
</html>
